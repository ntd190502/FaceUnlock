name: Build FaceUnlock Credential Provider DLL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-credential-provider:
    name: Build FaceUnlock Credential Provider x64
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake (x64)
        run: |
          cmake -B windows/CredentialProvider/build -S windows/CredentialProvider -A x64

      - name: Build Credential Provider DLL (Release)
        run: |
          cmake --build windows/CredentialProvider/build --config Release

      - name: Verify FaceUnlockCredentialProvider.dll
        shell: pwsh
        run: |
          $dll = "windows/CredentialProvider/build/Release/FaceUnlockCredentialProvider.dll"
          if (-not (Test-Path $dll)) {
            throw "ERROR: FaceUnlockCredentialProvider.dll not found at $dll"
          }
          $item = Get-Item $dll
          Write-Host "Found DLL: $($item.FullName)"
          Write-Host "Size: $([math]::Round($item.Length / 1KB, 2)) KB ($($item.Length) bytes)"
          $hash = (Get-FileHash -Algorithm SHA256 $item.FullName).Hash.ToLower()
          Write-Host "SHA256: $hash"

      - name: Prepare Artifact Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "windows/dist/CredentialProvider" -Force | Out-Null
          Copy-Item "windows/CredentialProvider/build/Release/FaceUnlockCredentialProvider.dll" "windows/dist/CredentialProvider/"
          Copy-Item "windows/CredentialProvider/Register.ps1" "windows/dist/CredentialProvider/"
          Copy-Item "windows/CredentialProvider/Unregister.ps1" "windows/dist/CredentialProvider/"
          Copy-Item "windows/CredentialProvider/Recovery.ps1" "windows/dist/CredentialProvider/"
          Copy-Item "windows/CredentialProvider/README.md" "windows/dist/CredentialProvider/"

      - name: Upload Credential Provider Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceUnlock-CredentialProvider-x64
          path: windows/dist/CredentialProvider/
          if-no-files-found: error
          retention-days: 30
