name: Build Complete FaceUnlock Windows Release

on:
  workflow_dispatch:

jobs:
  build-release:
    name: Build Windows Release Package
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish FaceUnlock.Agent x64
        shell: pwsh
        run: |
          dotnet publish windows/FaceUnlock.Agent/FaceUnlock.Agent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o windows/dist/publish-agent

      - name: Publish FaceUnlock.Service x64
        shell: pwsh
        run: |
          dotnet publish windows/FaceUnlock.Service/FaceUnlock.Service.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o windows/dist/publish-service

      - name: Publish FaceUnlock.Shell x64
        shell: pwsh
        run: |
          dotnet publish windows/FaceUnlock.Shell/FaceUnlock.Shell.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o windows/dist/publish-shell

      - name: Prepare Installer Staging Directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path windows/installer/bin -Force
          Copy-Item windows/dist/publish-agent/FaceUnlock.Agent.exe windows/installer/bin/
          Copy-Item windows/dist/publish-service/FaceUnlock.Service.exe windows/installer/bin/
          Copy-Item windows/dist/publish-shell/FaceUnlockShell.exe windows/installer/bin/
          Copy-Item windows/dist/publish-agent/FaceUnlock.Core.dll windows/installer/bin/ -ErrorAction SilentlyContinue
          Copy-Item windows/scripts/FaceUnlock-Shell-Recovery.ps1 windows/installer/bin/
          Copy-Item windows/scripts/Enable-ShellGate.ps1 windows/installer/bin/
          Copy-Item windows/scripts/Disable-ShellGate.ps1 windows/installer/bin/
          Copy-Item windows/scripts/Check-ShellGate.ps1 windows/installer/bin/
          Copy-Item windows/scripts/Cleanup-PhaseE.ps1 windows/installer/bin/
          Copy-Item windows/scripts/Setup-Ready.ps1 windows/installer/bin/

          $required = @('FaceUnlock.Agent.exe','FaceUnlock.Service.exe','FaceUnlockShell.exe','Setup-Ready.ps1','Enable-ShellGate.ps1','Disable-ShellGate.ps1','Check-ShellGate.ps1','Cleanup-PhaseE.ps1')
          foreach ($name in $required) {
            if (-not (Test-Path (Join-Path windows/installer/bin $name))) { throw "Missing current installer file: $name" }
          }
          $forbidden = @('FaceUnlockCredentialProvider.dll','FaceUnlockAuthPackage.dll','Enable-CredentialProvider.ps1','Disable-CredentialProvider.ps1','Enable-AuthPackage.ps1','Disable-AuthPackage.ps1','Check-AuthPackage.ps1')
          foreach ($name in $forbidden) {
            if (Test-Path (Join-Path windows/installer/bin $name)) { throw "Legacy file leaked into installer staging: $name" }
          }

          # Also prepare Portable directory
          New-Item -ItemType Directory -Path windows/dist/Portable -Force
          Copy-Item windows/installer/bin/* windows/dist/Portable/

      - name: Test legacy upgrade migration
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows/scripts/Test-LegacyCleanup.ps1

      - name: Install Inno Setup & Compile Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows/installer/FaceUnlock.iss /Owindows/dist

      - name: Generate SHA256 Checksums
        shell: pwsh
        run: |
          cd windows/dist
          Get-FileHash FaceUnlock-Setup.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | Out-File -Encoding utf8 FaceUnlock-Setup.exe.sha256.txt
          Get-Content FaceUnlock-Setup.exe.sha256.txt

      - name: Upload FaceUnlock-Windows-Release-x64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceUnlock-Windows-Release-x64
          path: |
            windows/dist/FaceUnlock-Setup.exe
            windows/dist/FaceUnlock-Setup.exe.sha256.txt
            windows/dist/Portable/*
