name: Build FaceUnlock TrollStore IPA

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - ".github/workflows/build-ios-ipa.yml"

  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle ID"
        required: true
        default: "io.faceunlock.app"
        type: string

permissions:
  contents: read

jobs:

  build-ipa:

    name: Build TrollStore IPA

    runs-on: macos-14

    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment
        run: |
          echo "macOS:"
          sw_vers

          echo
          echo "Xcode:"
          xcodebuild -version

          echo
          echo "Swift:"
          swift --version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

          xcodegen --version

      - name: Check project files
        run: |
          test -f ios/project.yml
          test -d ios/FaceUnlock
          test -f ios/scripts/build_trollstore_ipa.sh

          echo "iOS source:"
          find ios/FaceUnlock \
            -maxdepth 3 \
            -type f \
            | sort

      - name: BLE frame self-test
        run: |
          if [ -f ios/scripts/ble_frame_selftest.swift ] && \
             [ -f ios/FaceUnlock/BLE/BLEFrameCodec.swift ]; then

            swiftc \
              ios/FaceUnlock/BLE/BLEFrameCodec.swift \
              ios/scripts/ble_frame_selftest.swift \
              -o "$RUNNER_TEMP/ble_frame_selftest"

            "$RUNNER_TEMP/ble_frame_selftest"

          else
            echo "BLE self-test files not present; skipping."
          fi

      - name: Build FaceUnlock TrollStore IPA
        env:
          BUNDLE_ID: ${{ inputs.bundle_id || 'io.faceunlock.app' }}
        run: |
          chmod +x ios/scripts/build_trollstore_ipa.sh

          ios/scripts/build_trollstore_ipa.sh

      - name: Inspect IPA
        run: |
          test -f ios/dist/FaceUnlock.ipa

          echo "IPA contents:"
          unzip -l ios/dist/FaceUnlock.ipa \
            | sed -n '1,150p'

          echo
          echo "Info.plist:"

          unzip -p \
            ios/dist/FaceUnlock.ipa \
            Payload/FaceUnlock.app/Info.plist \
            > "$RUNNER_TEMP/Info.plist"

          plutil -p "$RUNNER_TEMP/Info.plist"

      - name: Generate SHA256
        run: |
          cd ios/dist

          shasum -a 256 FaceUnlock.ipa \
            | tee FaceUnlock.ipa.sha256

      - name: Upload FaceUnlock IPA
        uses: actions/upload-artifact@v4
        with:
          name: FaceUnlock-TrollStore
          path: |
            ios/dist/FaceUnlock.ipa
            ios/dist/FaceUnlock.ipa.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Upload Build Log Artifact on Failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ios/build/xcodebuild.log
          if-no-files-found: ignore
