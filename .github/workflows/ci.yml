name: CI - Windows & Hosting & Static Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Projects (.NET 8)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: |
          dotnet restore windows/FaceUnlock.Core/FaceUnlock.Core.csproj
          dotnet restore windows/FaceUnlock.Agent/FaceUnlock.Agent.csproj
          dotnet restore windows/FaceUnlock.Service/FaceUnlock.Service.csproj
          dotnet restore windows/FaceUnlock.Shell/FaceUnlock.Shell.csproj
          dotnet restore windows/FaceUnlock.ShellTests/FaceUnlock.ShellTests.csproj
          dotnet restore windows/FaceUnlock.BleFrameSelfTest/FaceUnlock.BleFrameSelfTest.csproj
          dotnet restore windows/FaceUnlock.IpcIntegrationTests/FaceUnlock.IpcIntegrationTests.csproj
          dotnet restore windows/FaceUnlock.UnitTests/FaceUnlock.UnitTests.csproj
          dotnet restore windows/FaceUnlock.NativeApiSelfTest/FaceUnlock.NativeApiSelfTest.csproj

      - name: Build FaceUnlock.Core (Release)
        run: dotnet build windows/FaceUnlock.Core/FaceUnlock.Core.csproj --configuration Release --no-restore

      - name: Build FaceUnlock.Agent (Release)
        run: dotnet build windows/FaceUnlock.Agent/FaceUnlock.Agent.csproj --configuration Release --no-restore

      - name: Build FaceUnlock.Service (Release)
        run: dotnet build windows/FaceUnlock.Service/FaceUnlock.Service.csproj --configuration Release --no-restore

      - name: Build FaceUnlock.Shell (Release)
        run: dotnet build windows/FaceUnlock.Shell/FaceUnlock.Shell.csproj --configuration Release --no-restore

      - name: Run FaceUnlock Shell Gate Safety Harness Tests
        run: dotnet run --project windows/FaceUnlock.ShellTests/FaceUnlock.ShellTests.csproj --configuration Release --no-restore

      - name: Run BLE framing self-test
        run: dotnet run --project windows/FaceUnlock.BleFrameSelfTest/FaceUnlock.BleFrameSelfTest.csproj --configuration Release --no-restore

      - name: Run FaceUnlock Transport & Bluetooth Lease Unit Tests
        run: dotnet run --project windows/FaceUnlock.UnitTests/FaceUnlock.UnitTests.csproj --configuration Release --no-restore

      - name: Run FaceUnlock IPC Integration Tests
        run: dotnet run --project windows/FaceUnlock.IpcIntegrationTests/FaceUnlock.IpcIntegrationTests.csproj --configuration Release --no-restore

      - name: Run real Windows F.2 native API smoke test
        run: dotnet run --project windows/FaceUnlock.NativeApiSelfTest/FaceUnlock.NativeApiSelfTest.csproj --configuration Release --no-restore

      - name: Test retired security stack upgrade migration
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File windows/scripts/Test-LegacyCleanup.ps1

      - name: Verify retired stack source and IPC are absent
        shell: pwsh
        run: |
          $removed = @('windows/CredentialProvider','windows/CredentialProviderHarness','windows/FaceUnlock.AuthPackage','windows/FaceUnlock.AuthPackageHarness','windows/CompanionCDF','windows/FaceUnlock.Core/LsaMachineSecretStore.cs')
          foreach ($path in $removed) { if (Test-Path $path) { throw "Retired source remains: $path" } }
          $runtime = Get-Content windows/FaceUnlock.Core/Models.cs,windows/FaceUnlock.Service/UnlockWorker.cs -Raw
          if ($runtime -match 'issue_lsa_ticket|LsaMachineSecretStore|lsa_secret_unavailable') { throw 'Retired LSA IPC/runtime reference remains' }

      - name: Test missing/existing service repair and idempotent Setup
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP 'FaceUnlock-Setup-Regression'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          dotnet publish windows/FaceUnlock.Service/FaceUnlock.Service.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $installDir
          dotnet publish windows/FaceUnlock.Shell/FaceUnlock.Shell.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o $installDir
          Copy-Item windows/scripts/Setup-Ready.ps1,windows/scripts/Cleanup-PhaseE.ps1,windows/scripts/Enable-ShellGate.ps1,windows/scripts/Disable-ShellGate.ps1,windows/scripts/FaceUnlock-Shell-Recovery.ps1 $installDir
          powershell -NoProfile -ExecutionPolicy Bypass -File windows/scripts/Test-SetupReadyRegression.ps1 -InstallDir $installDir

      - name: Verify BLE framing source is compiled
        shell: pwsh
        run: |
          if (-not (Test-Path "windows/FaceUnlock.Core/BleFrameCodec.cs")) { throw "Missing Windows BleFrameCodec.cs" }
          if (-not (Select-String -Path "windows/FaceUnlock.Core/BleScanner.cs" -Pattern "BleFrameCodec" -Quiet)) { throw "BleScanner does not use BleFrameCodec" }

  lint-hosting:
    name: Lint Hosting PHP & Static Source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, openssl

      - name: Check required hosting files
        run: |
          test -f hosting/schema.sql
          test -f hosting/config.example.php
          test -f hosting/migrations/20260820_plain_approval_url.sql
          test -f hosting/public/index.php
          test -f hosting/src/Auth.php
          test -f hosting/src/Crypto.php
          test -f hosting/src/Database.php
          test -f hosting/src/ApprovalLink.php
          test -f hosting/src/TelegramClient.php
          test -f hosting/src/Util.php
          test -f hosting/tests/telegram_plain_url_test.php

      - name: Lint PHP files
        run: |
          php -l hosting/public/index.php
          php -l hosting/config.example.php
          for file in hosting/src/*.php; do
            php -l "$file"
          done
          for file in hosting/tests/*.php; do
            php -l "$file"
          done

      - name: Test Telegram plain approval URL
        run: php hosting/tests/telegram_plain_url_test.php

      - name: Test Hosting V2 migration and security contract
        run: php hosting/tests/hosting_v2_static_test.php

      - name: Verify current notification architecture
        run: |
          if grep -R -n -E 'PushManager|ApnsClient|aps-environment|remote-notification' ios/FaceUnlock hosting/src; then
            echo "Error: obsolete APNs runtime reference found"
            exit 1
          fi
          grep -R -n 'TelegramClient' hosting/public/index.php
          grep -R -n '/v1/unlock/pending' hosting/public/index.php ios/FaceUnlock/Network/APIClient.swift
          if grep -R -n -E 'reply_markup|inline_keyboard|callback_data|callback_query|answerCallbackQuery' hosting/public hosting/src; then
            echo "Error: Telegram callback/button runtime reference found"
            exit 1
          fi
          grep -R -n 'approval_token_hash' hosting/public/index.php hosting/schema.sql

      - name: Verify BLE framing and secure token sources
        run: |
          test -f ios/FaceUnlock/BLE/BLEFrameCodec.swift
          test -f windows/FaceUnlock.Core/BleFrameCodec.cs
          test -f windows/FaceUnlock.BleFrameSelfTest/Program.cs
          grep -n 'BLEFrameCodec' ios/FaceUnlock/BLE/BLEPeripheralManager.swift
          grep -n 'BleFrameCodec' windows/FaceUnlock.Core/BleScanner.cs
          grep -n 'KeychainHelper' ios/FaceUnlock/Config.swift
          grep -n 'ProtectedData' windows/FaceUnlock.Core/ConfigStore.cs

      - name: Verify manifest has no removed runtime files
        run: |
          if grep -E 'FaceUnlock/Push/PushManager.swift|hosting/src/ApnsClient.php' MANIFEST.txt; then
            echo "Error: manifest still references removed APNs runtime files"
            exit 1
          fi
          if grep -E 'CredentialProvider/|CredentialProviderHarness/|FaceUnlock.AuthPackage/|FaceUnlock.AuthPackageHarness/|CompanionCDF/|LsaMachineSecretStore.cs' FULL_SOURCE_MANIFEST.txt; then
            echo "Error: full manifest still references retired Windows security source"
            exit 1
          fi

  test-ble-framing-swift:
    name: Test BLE Framing (Swift)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Compile and run BLE framing self-test
        run: |
          swiftc \
            ios/FaceUnlock/BLE/BLEFrameCodec.swift \
            ios/scripts/ble_frame_selftest.swift \
            -o "$RUNNER_TEMP/ble_frame_selftest"
          "$RUNNER_TEMP/ble_frame_selftest"

      - name: Compile and run logical unlock biometric self-test
        run: |
          swiftc \
            ios/FaceUnlock/Unlock/LogicalBiometricApprovalCache.swift \
            ios/scripts/logical_unlock_selftest.swift \
            -o "$RUNNER_TEMP/logical_unlock_selftest"
          "$RUNNER_TEMP/logical_unlock_selftest"
